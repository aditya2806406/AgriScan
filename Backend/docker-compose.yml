version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agriscan
      POSTGRES_USER: agriscan
      POSTGRES_PASSWORD: agriscan
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://agriscan:agriscan@db:5432/agriscan
      MODEL_PATH: /app/ml/models/mobilenetv2_plantvillage.pt
      TREATMENTS_PATH: /app/data/treatments.json
      ALLOW_MOCK: "true"  # flip to "false" once you have a trained model mounted below
    volumes:
      - ./ml:/app/ml
      - ./data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
